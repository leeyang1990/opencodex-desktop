name: Release macOS App

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish arm64 release
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Build and verify release package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./scripts/release.sh "$version"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="dist/release/OpenCodex-Desktop-v${version}-macOS-arm64.zip"
          dmg="dist/release/OpenCodex-Desktop-v${version}-macOS-arm64.dmg"
          checksum="${archive}.sha256"
          dmg_checksum="${dmg}.sha256"
          notes_file="${RUNNER_TEMP}/release-notes-${version}.md"

          awk -v version="$version" '
            index($0, "## " version " - ") == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > "$notes_file"

          if [[ ! -s "$notes_file" ]]; then
            echo "Missing CHANGELOG.md section for version ${version}" >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$archive" "$checksum" "$dmg" "$dmg_checksum" --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file "$notes_file"
          else
            gh release create "$GITHUB_REF_NAME" \
              "$archive" "$checksum" "$dmg" "$dmg_checksum" \
              --verify-tag \
              --notes-file "$notes_file" \
              --title "OpenCodex Desktop ${version}"
          fi
