name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source, tests, and app bundle
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check source quality
        run: ./scripts/check-source-quality.sh

      - name: Run tests
        run: swift test

      - name: Build app bundle
        run: ./scripts/build-app.sh
